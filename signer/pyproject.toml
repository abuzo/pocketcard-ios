[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketcard-signer"
version = "0.1.0"
description = "Private, authenticated Apple Wallet pass signer for PocketCard"
requires-python = ">=3.12"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.4", "Pillow==12.3.0", "cryptography==46.0.4", "uvicorn==0.48.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["pocketcard_signer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
