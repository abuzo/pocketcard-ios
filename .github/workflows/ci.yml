name: PocketCard checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './signer[test]'
      - run: python -m pytest -q
        working-directory: signer
      - run: python scripts/generate_xcode_project.py --check
      - run: python -m unittest discover -s scripts/tests -v
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: swift --version && xcodebuild -version
      - run: swift test
      - run: bash scripts/test-ios.sh
